[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-image-engine-yolo12n"
version = "0.1.0"
description = "Cat detection microservice powered by YOLO12n"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Backend extras: install only the one you deploy.
# onnx: serve an exported .onnx model without PyTorch (Docker image, Render).
onnx = ["onnxruntime>=1.17", "pi-heif>=0.18"]
# ultralytics: serve .pt weights and fine-tune. YOLO12 needs ultralytics 8.3.78+.
ultralytics = ["ultralytics>=8.3.78", "pi-heif>=0.18"]
# export: training/export.py, .pt -> .onnx
export = ["ultralytics>=8.3.78", "onnx>=1.12", "onnxslim>=0.1.82"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
